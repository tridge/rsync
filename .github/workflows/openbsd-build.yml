name: Test rsync on OpenBSD

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '.github/workflows/*.yml'
      - '!.github/workflows/openbsd-build.yml'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '.github/workflows/*.yml'
      - '!.github/workflows/openbsd-build.yml'
  schedule:
    - cron: '42 8 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test rsync on OpenBSD
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Test in OpenBSD VM
      id: test
      uses: vmactions/openbsd-vm@v1
      with:
        usesh: true
        prepare: |
          pkg_add -I bash autoconf%2.71 automake%1.16
        run: |
          uname -a
          export AUTOCONF_VERSION=2.71
          export AUTOMAKE_VERSION=1.16
          ./configure --with-rrsync --disable-zstd --disable-md2man --disable-xxhash --disable-lz4
          make
          ./rsync --version
          # Both runs are throttled to -j2 on this job (vs -j8 elsewhere): it
          # runs inside a nested VM, and the default parallelism over-subscribes
          # it.  Under that resource pressure a daemon test occasionally stalls
          # to the 300s timeout -- the --use-tcp run loses a loopback
          # connection-handshake timing race, and the pipe `make check` run
          # likewise stalls a forked-daemon test (daemon-config has been seen).
          # It is an environment artifact, not an rsync bug (deadlock-free and
          # unreproducible elsewhere, even at -j16 on a 6-CPU host); -j2 keeps
          # the nested VM from over-subscribing.
          make check CHECK_J=2
          ./runtests.py --rsync-bin=`pwd`/rsync --use-tcp -j 2
          ./rsync-ssl --no-motd download.samba.org::rsyncftp/ || true
    - name: save artifact
      uses: actions/upload-artifact@v4
      with:
        retention-days: 45
        name: openbsd-bin
        path: |
          rsync
          rsync-ssl
          rsync.1
          rsync-ssl.1
          rsyncd.conf.5
          rrsync.1
          rrsync
