name: Test rsync on OpenBSD

# FLAKE-HUNT BRANCH: the only workflow kept on this branch.  PUSH the branch
# (do NOT open a PR -- pull_request events run the base branch's workflows, i.e.
# master's full matrix).  workflow_dispatch lets you re-run to gather samples.
on:
  push:
    branches: [ openbsd-flake ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test rsync on OpenBSD
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Test in OpenBSD VM
      id: test
      uses: vmactions/openbsd-vm@v1
      with:
        usesh: true
        prepare: |
          pkg_add -I bash autoconf%2.71 automake%1.16
        run: |
          uname -a
          export AUTOCONF_VERSION=2.71
          export AUTOMAKE_VERSION=1.16
          ./configure --with-rrsync --disable-zstd --disable-md2man --disable-xxhash --disable-lz4
          # check-progs builds rsync AND the test helper programs + symlinks that
          # runtests.py needs (plain `make` builds only rsync; the helpers are
          # normally built as a dependency of the `check` target we bypass here).
          make check-progs
          ./rsync --version
          # FLAKE HUNT: loop the pipe suite at the *un-throttled* -j8 (the
          # parallelism that exhibited the intermittent daemon-test hang) to try
          # to reproduce it, with a shorter per-test timeout so a hang surfaces
          # fast.  runtests now dumps the hung process tree (ps WCHAN + fstat) on
          # timeout, so a reproduction is diagnosable straight from this log.
          # Stops at the first hang; "no hang" after all iterations is a clean
          # (non-)result.  Bump the count / -j if it doesn't reproduce.
          for i in $(seq 1 20); do
            echo "=================== flake-hunt iteration $i ==================="
            ./runtests.py --rsync-bin=`pwd`/rsync -j 8 --timeout 120 || {
              echo "########## REPRODUCED a hang/failure on iteration $i ##########"
              exit 1
            }
          done
          echo "no hang reproduced in 20 iterations at -j8"
    - name: save artifact
      uses: actions/upload-artifact@v4
      with:
        retention-days: 45
        name: openbsd-bin
        path: |
          rsync
          rsync-ssl
          rsync.1
          rsync-ssl.1
          rsyncd.conf.5
          rrsync.1
          rrsync
